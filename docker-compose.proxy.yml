# Own TLS with Caddy. Only if you do not use Cloudflare Tunnel.
#
# The tunnel already terminates TLS at the Cloudflare edge: cloudflared
# speaks plain HTTP with the container over the Compose network. Adding
# Caddy there would mean two TLS terminators and one more open port with
# nothing gained.
#
# This overlay is for the opposite case: you want the server to terminate
# TLS with a public certificate, without depending on Cloudflare.
#
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
#
# In Portainer: "Additional paths" with this file.
#
# deploy/Caddyfile uses `tls internal` so it does not request a public
# certificate at startup. For the real domain, remove that line, define
# MCP_PUBLIC_HOST with a name that resolves to this server, and leave 80
# and 443 free.
#
# Caddy does not carry cap_drop: ALL because it has to open those ports.
# The MCP process does run without capabilities.

services:
  caddy:
    container_name: mailproxy-mcp-caddy
    image: caddy:2-alpine
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0}:80:80"
      - "${CADDY_HTTPS_BIND:-0.0.0.0}:443:443"
    environment:
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mcp
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  caddy-data:
  caddy-config:
