# Portainer stack. All configuration goes in environment variables: in the
# stack form, under "Load variables from .env file", or in an .env file
# next to the compose file.
#
# This is the base stack: the MCP server, the control panel, and the audit
# log rotation.
#
#   docker-compose.tunnel.yml   Cloudflare Tunnel. No port has to be opened
#                                on the host.
#   docker-compose.proxy.yml     Caddy with its own TLS (Let's Encrypt).
#
# In Portainer they are added as "Additional paths", which is the same as
# passing several -f to docker compose.
#
# The local image is called mailproxy-mcp:local and is not in a registry.
# Portainer runs `docker compose pull` before `up`: the pull_policy
# build/never setting keeps that pull from looking for it.
# Already published image: MCP_IMAGE=registry/mailproxy-mcp:1 and MCP_PULL_POLICY=always.
#
# The container listens on 0.0.0.0:8765 because the proxy or the tunnel
# reaches it through the Docker network. The host port is published on
# 127.0.0.1 only.
#
# The panel listens on 0.0.0.0:8766 and its host port is published on
# 127.0.0.1 as well. The panel sees the account passwords: do not publish
# it outside loopback.
#
# The database lives in the data volume, at /var/lib/mcp-correo. Without
# that volume the container is read-only and the database cannot be
# written: the accounts would be lost on every restart.
#
# Do not put secrets in this file: Portainer fills them in as ${VAR}.
# The complete variable contract is in docs/configuration.md.

services:
  mcp:
    container_name: mailproxy-mcp
    image: ${MCP_IMAGE:-mailproxy-mcp:local}
    pull_policy: ${MCP_PULL_POLICY:-build}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # Where the container's variables come from.
    #
    # stack.env: written by Portainer with every stack variable (the ones
    # you define by hand and the ones from the .env you upload). It is what
    # carries the stack variables into the container.
    #
    # .env: the file in the compose directory. Compose reads it to
    # interpolate and we also pass it here, so the variables reach the
    # container in a local deployment, where there is no stack.env.
    #
    # Both are optional: whichever exists is used. What the process really
    # needs (the bearer, the key, and the panel token) is checked at
    # startup, and it says which one is missing.
    # Compose 2.24 or later.
    env_file:
      - path: ${MCP_STACK_ENV_FILE:-stack.env}
        required: false
      - path: .env
        required: false
    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Set MCP_BEARER_TOKEN in the stack variables}
      MCP_BIND_HOST: 0.0.0.0
      MCP_BIND_PORT: "8765"
      MCP_ALLOW_NONLOCAL_BIND: "1"
      MCP_AUDIT_LOG: /var/log/mcp-correo/audit.jsonl
      # Accounts are managed from the panel and live in the database.
      #
      # Global switches. Off by default.
      MCP_ENABLE_SEND: ${MCP_ENABLE_SEND:-false}
      MCP_ENABLE_MARK: ${MCP_ENABLE_MARK:-false}
      MCP_ENABLE_DELETE: ${MCP_ENABLE_DELETE:-false}
      MCP_ENABLE_DRAFTS: ${MCP_ENABLE_DRAFTS:-false}
      # Direct sending: a single call, with no confirmation per message.
      # Off by default; the per-account permission is set in the panel.
      MCP_ENABLE_DIRECT_SEND: ${MCP_ENABLE_DIRECT_SEND:-false}
      # Network. MCP_PUBLIC_HOST builds allowed_hosts and allowed_origins;
      # the explicit lists replace them.
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      # Limits. The client cannot raise them.
      MCP_MAX_RESULTS: ${MCP_MAX_RESULTS:-100}
      MCP_MAX_CHARS: ${MCP_MAX_CHARS:-20000}
      MCP_MAX_ATTACHMENT_BYTES: ${MCP_MAX_ATTACHMENT_BYTES:-5000000}
      MCP_MAX_MESSAGE_BYTES: ${MCP_MAX_MESSAGE_BYTES:-15000000}
      MCP_IMAP_TIMEOUT: ${MCP_IMAP_TIMEOUT:-20}
      MCP_SENT_SCAN_LIMIT: ${MCP_SENT_SCAN_LIMIT:-300}
      MCP_CONFIRM_TTL_SECONDS: ${MCP_CONFIRM_TTL_SECONDS:-600}
      MCP_MAX_RECIPIENTS: ${MCP_MAX_RECIPIENTS:-10}
      MCP_MAX_SENDS_PER_DAY: ${MCP_MAX_SENDS_PER_DAY:-30}
      MCP_MAX_DELETE_PER_CALL: ${MCP_MAX_DELETE_PER_CALL:-20}
      MCP_MAX_MARK_PER_CALL: ${MCP_MAX_MARK_PER_CALL:-50}
      MCP_SMTP_TIMEOUT: ${MCP_SMTP_TIMEOUT:-30}
      MCP_SMTP_SECURITY: ${MCP_SMTP_SECURITY:-ssl}
      MCP_ALLOWED_RECIPIENT_DOMAINS: ${MCP_ALLOWED_RECIPIENT_DOMAINS:-}
      MCP_ALLOWED_ATTACHMENT_TYPES: ${MCP_ALLOWED_ATTACHMENT_TYPES:-}
      # Control panel. It is always there: it is the way to manage the
      # accounts. The database lives in the data volume, so it survives
      # restarts and redeployments.
      #
      # MCP_DASHBOARD_KEY encrypts the account passwords. It is not in the
      # database: if it is lost, the stored passwords cannot be decrypted.
      # Keep a separate copy.
      MCP_DASHBOARD_DB: ${MCP_DASHBOARD_DB:-/var/lib/mcp-correo/cuentas.db}
      MCP_DASHBOARD_KEY: ${MCP_DASHBOARD_KEY:?Set MCP_DASHBOARD_KEY in the stack variables}
      MCP_DASHBOARD_TOKEN: ${MCP_DASHBOARD_TOKEN:?Set MCP_DASHBOARD_TOKEN in the stack variables}
      MCP_DASHBOARD_BIND_HOST: 0.0.0.0
      MCP_DASHBOARD_BIND_PORT: "8766"
    ports:
      - "${MCP_PUBLISH_BIND:-127.0.0.1}:${MCP_PUBLISH_PORT:-8765}:8765"
      # The panel, loopback only. Do not publish it as it is: the host port
      # comes out on 127.0.0.1 and whoever opens it has the passwords.
      - "${MCP_DASHBOARD_PUBLISH_BIND:-127.0.0.1}:${MCP_DASHBOARD_PUBLISH_PORT:-8766}:8766"
    volumes:
      - audit:/var/log/mcp-correo
      # The accounts database. The container is read-only: without this
      # volume, the database cannot be written.
      - data:/var/lib/mcp-correo
    # Optional Traefik labels. Replace the domain and the proxy network.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.mailproxy-mcp.rule=Host(`mcp.example.com`)"
    #   - "traefik.http.routers.mailproxy-mcp.entrypoints=websecure"
    #   - "traefik.http.routers.mailproxy-mcp.tls=true"
    #   - "traefik.http.routers.mailproxy-mcp.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.mailproxy-mcp.loadbalancer.server.port=8765"
    #   - "traefik.docker.network=proxy"
    # networks:
    #   - default
    #   - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 128
        reservations:
          memory: 64M

  audit-rotate:
    container_name: mailproxy-mcp-audit-rotate
    image: ${MCP_IMAGE:-mailproxy-mcp:local}
    # Same image as mcp. No separate build: it is built only once.
    # never: the Portainer pull does not look for mailproxy-mcp:local in a registry.
    pull_policy: ${MCP_PULL_POLICY:-never}
    depends_on:
      - mcp
    entrypoint: ["python", "/app/docker/rotate_audit.py"]
    command: ["--loop"]
    # The image HEALTHCHECK expects an HTTP server on 8765 and on the
    # panel's 8766. This service does not serve HTTP: it is a loop that
    # watches the file. Without this the container would stay "unhealthy"
    # forever, with Connection refused.
    healthcheck:
      disable: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    memswap_limit: 64m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      MCP_AUDIT_LOG: /var/log/mcp-correo/audit.jsonl
      MCP_AUDIT_MAX_BYTES: ${MCP_AUDIT_MAX_BYTES:-10485760}
      MCP_AUDIT_KEEP: ${MCP_AUDIT_KEEP:-12}
      MCP_AUDIT_ROTATE_SECONDS: ${MCP_AUDIT_ROTATE_SECONDS:-3600}
    volumes:
      - audit:/var/log/mcp-correo
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  # The audit log: one JSONL entry per call.
  audit:
  # The database: domains and accounts, with the passwords encrypted.
  # Without this volume the container is read-only and the accounts would
  # be lost on every restart.
  data:

# External network of an existing Traefik. Uncomment together with the labels.
# networks:
#   proxy:
#     external: true
#     name: proxy
