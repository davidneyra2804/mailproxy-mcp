[project]
name = "mailproxy-mcp"
version = "2.4.0"
description = "Mail MCP server: IMAP reading and writing under confirmation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Actions runner sets PYTHONSAFEPATH and does not add the working
# directory to sys.path. Without this, `import audit` fails in CI only.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
