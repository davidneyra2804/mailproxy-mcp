# Exposure through Cloudflare Tunnel. Adds the cloudflared service, which
# talks to mcp over the stack network (http://mcp:8765) and reaches the
# Internet through outgoing connections. No port has to be opened on the
# host.
#
# You do not need Caddy: TLS is terminated at the Cloudflare edge and
# cloudflared speaks plain HTTP with the container. If you prefer your own
# TLS with Let's Encrypt, see docker-compose.proxy.yml.
#
# In Portainer: Stacks → Add stack → Repository, and in "Additional paths"
# add this file. Or on the machine:
#
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
#
# In the Cloudflare dashboard, the published route points to
# http://mcp:8765. MCP_PUBLIC_HOST has to be the public hostname of the
# tunnel: cloudflared forwards the client's Host header and the MCP
# transport validates it.
#
# The port the base compose publishes on 127.0.0.1 is harmless: it is
# loopback and useful for debugging with curl. If you prefer it not to
# exist, remove the ports: block from the mcp service in docker-compose.yml.
#
# The tunnel carries only the MCP server (http://mcp:8765). The panel (8766)
# is not published this way: its port comes out on loopback, and if you
# exposed it, the panel —which sees the account passwords— would sit behind
# the same Access filter as the MCP server.
#
# Cloudflare Access is optional. With a Service Token, the MCP client sends
# CF-Access-Client-Id and CF-Access-Client-Secret in addition to the Bearer.
# Without Access, the only secret is the MCP Bearer.

services:
  cloudflared:
    container_name: mailproxy-mcp-cloudflared
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    pull_policy: missing
    restart: unless-stopped
    # The image already ships --no-autoupdate in its ENTRYPOINT.
    command:
      - tunnel
      - --protocol
      - ${CLOUDFLARE_TUNNEL_PROTOCOL:-quic}
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in the stack variables}
    depends_on:
      - mcp
    # The connector is a network client: it does not need root, but it can
    # write state in its home. That is why it does not carry read_only.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
