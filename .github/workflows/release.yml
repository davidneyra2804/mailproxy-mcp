name: release

# Publishes the image and creates the GitHub Release from a tag.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag is what counts: the number has to match version.py or the
# workflow fails before publishing anything.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the Release
  packages: write # publish the image to GHCR

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check . && ruff format --check .

      - name: Pytest
        run: pytest

      - name: The tag has to match the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$VERSION" != "$(python -c 'from version import __version__; print(__version__)')" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MCP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: CHANGELOG notes
        env:
          RELEASE_VERSION: ${{ env.VERSION }}
          RELEASE_IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_VERSION"]
          image = os.environ["RELEASE_IMAGE"]
          texto = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          patron = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)"
          encontrado = re.search(patron, texto, re.MULTILINE | re.DOTALL)
          seccion = encontrado.group(1).strip() if encontrado else ""
          if not seccion:
              print(f"::warning::The CHANGELOG has no section for {version}")
          lineas = [
              "## Image",
              "",
              "```",
              image + ":" + version,
              "```",
              "",
              "In Portainer, to use the published image:",
              "",
              "```",
              "MCP_IMAGE=" + image + ":" + version,
              "MCP_PULL_POLICY=always",
              "```",
              "",
              "## Changes",
              "",
              seccion,
              "",
          ]
          pathlib.Path("release-notes.md").write_text("\n".join(lineas), encoding="utf-8")
          PY

      - name: Create the Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          generate_release_notes: true
          body_path: release-notes.md
